name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.1', '8.2']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: phpunit

      - name: PHP lint
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Install QA dependencies
        run: composer install --no-interaction --no-progress

      - name: Run PHPUnit
        run: phpunit -c phpunit.xml.dist

      - name: Run PHPCS (WPCS subset)
        run: composer run lint:phpcs

      - name: Run PHPStan (level 2)
        run: composer run lint:phpstan

      - name: Release checks
        run: composer run release-check

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release zips
        run: ./scripts/build-zips.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taxid-guard-release-zips
          path: dist-release/*.zip
