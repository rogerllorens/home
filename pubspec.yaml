name: scanly
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^7.0.1
  qr_code_scanner: ^1.0.1
  qr_flutter: ^4.1.0
  image_picker: ^1.0.0
  photo_manager: ^3.7.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.0.15
  permission_handler: ^12.0.0+1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  pdf: ^3.10.4
  share_plus: ^11.0.0
  social_sharing_plus: ^1.2.3
  whatsapp_share: ^2.0.2
  local_auth: ^2.1.7
  firebase_core: ^3.15.0
  firebase_analytics: ^11.5.1
  in_app_review: ^2.0.4
  connectivity_plus: ^6.1.4
  internet_connection_checker: ^3.0.1
  flutter_localizations:
    sdk: flutter
  google_ml_kit: ^0.20.0
  google_mlkit_language_id: ^0.13.0
  google_mlkit_translation: ^0.13.0
  image: ^4.5.4
  camera: ^0.11.1
  http: ^1.2.0
  safe_browsing: ^0.1.1
  url_launcher: ^6.2.6
  badges: ^3.1.2
  flutter_contacts: ^1.1.6
  add_2_calendar: ^3.0.1
  screenshot: ^3.0.0
  introduction_screen: ^3.1.8
  flutter_tesseract_ocr: ^0.4.28
  icalendar_parser: ^2.0.3
  flutter_map: ^8.1.1
  latlong2: ^0.9.0
  fl_chart: ^1.0.0
  crop_your_image: ^2.0.0
  flutter_dotenv: ^5.1.0
  showcaseview: ^4.0.1
  lottie: ^3.3.1
  flutter_svg: ^2.0.7

dev_dependencies:
  flutter_native_splash: ^2.4.6
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/animations/
    - assets/malicious_urls.txt
  generate: true
  localizations:
    arb-dir: l10n
    template-arb-file: app_en.arb
    output-localization-file: app_localizations.dart

flutter_native_splash:
  color: "#000000"
  image: assets/logo_light.png
  color_dark: "#000000"
  image_dark: assets/logo_dark.png
  android_12:
    icon_background_color: "#000000"
    icon_background_color_dark: "#000000"
